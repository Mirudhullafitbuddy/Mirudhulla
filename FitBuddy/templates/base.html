<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FitBuddy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="topbar"><a class="brand" href="/">Fit<span>Buddy</span></a><a class="nav-link" href="/docs">API Docs</a></header>
<main class="page">{% block content %}{% endblock %}</main>
<footer>FitBuddy • AI-assisted wellness planning • Demo project</footer>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
